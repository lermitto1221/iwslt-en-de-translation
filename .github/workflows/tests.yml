name: CPU regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt -r requirements-pretrained.txt -c requirements.txt
      - name: Run CPU tests
        shell: pwsh
        run: |
          @'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print("CPU CI requires every discovered regression check; skipped:", result.skipped)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          '@ | python -
      - name: Verify public package
        run: python scripts/verify_public_package.py
